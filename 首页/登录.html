<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Dusky Souls</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            user-select: none;
        }
        img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .nav {
            position: absolute;
            top: 20px;
            right: 40px;
            font-family: Arial, sans-serif;
            font-size: 20px;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 16px;
            border: 1px solid #fff;
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            transition: all 0.3s;
            cursor: pointer;
        }
        .nav a:hover {
            background: rgba(255,255,255,0.85);
            color: #000;
        }
        h1 {
            position: absolute;
            top: 16%;
            width: 100%;
            text-align: center;
            font-size: 120px;
            font-family: 'UnifrakturCook', cursive;
            margin: 0;
        }
        h1 span {
            display: inline-block;
            background: linear-gradient(180deg, #d4af37, #8b0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 20px rgba(255, 140, 0, 0.7),
                0 0 40px rgba(255, 69, 0, 0.9),
                4px 4px 15px rgba(0, 0, 0, 0.8);
            letter-spacing: 8px;
            animation: glow 3s ease-in-out infinite;
            cursor: default;
        }
        @keyframes glow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .center {
            position: absolute;
            bottom: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .btn {
            padding: 18px 50px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 26px;
            font-family: Arial, sans-serif;
            text-decoration: none;
            border-radius: 15px;
            border: 2px solid #fff;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn:hover {
            background: rgba(255,255,255,0.9);
            color: #000;
            transform: scale(1.05);
        }

        /* === 登录注册弹窗 === */
        .modal {
            display: none;
            position: fixed;
            z-index: 99;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            color: #fff;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            animation: popup 0.4s ease;
        }
        @keyframes popup {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h2 { margin-bottom: 20px; }
        .modal-content input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #d4af37;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal-content button:hover { background: #f5d76e; }
        .close {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: #fff;
        }
        .switch { margin-top: 15px; font-size: 14px; }
        .switch a { color: #ffd700; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio id="bgm" src="audio/首页.mp3" loop></audio>
    <!-- ding 音效 -->
    <audio id="ding-sound" src="audio/ding.mp3" preload="auto"></audio>

    <div class="nav">
        <a id="openModal">登录  注册</a>
    </div>
    <h1><span>Dusky Souls</span></h1>
    <img src="images/首页.jpg">
    <div class="center">
        <a href="game.html" class="btn">开始游戏</a>
    </div>

    <!-- 登录注册弹窗 -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalTitle">登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button id="submitBtn">登录</button>
            <div class="switch">
                还没有账号？ <a id="switchToRegister">注册</a>
            </div>
        </div>
    </div>

    <script>
        // === 背景音乐逻辑 ===
        document.addEventListener("click", function () {
            const bgm = document.getElementById("bgm");
            bgm.volume = 0.6;
            bgm.play().catch(err => console.log("BGM play blocked:", err));
        }, { once: true });

        // === ding 音效 ===
        const ding = document.getElementById("ding-sound");
        ding.volume = 1.0;
        document.querySelectorAll("a, .btn").forEach(link => {
            link.addEventListener("mouseenter", () => {
                ding.currentTime = 0;
                ding.play();
            });
        });

        // === 弹窗控制 ===
        const modal = document.getElementById("authModal");
        const openBtn = document.getElementById("openModal");
        const closeBtn = document.getElementById("closeModal");
        const modalTitle = document.getElementById("modalTitle");
        const submitBtn = document.getElementById("submitBtn");
        const switchToRegister = document.getElementById("switchToRegister");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        // 打开/关闭弹窗
        openBtn.onclick = () => {
            modal.style.display = "flex";
            // 载入记忆的账号密码
            usernameInput.value = localStorage.getItem("username") || "";
            passwordInput.value = localStorage.getItem("password") || "";
        };
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

        // 切换 登录/注册
        switchToRegister.onclick = () => {
            if (modalTitle.innerText === "登录") {
                modalTitle.innerText = "注册";
                submitBtn.innerText = "注册";
                switchToRegister.innerText = "登录";
                document.querySelector(".switch").innerHTML = '已有账号？ <a id="switchToRegister">登录</a>';
            } else {
                modalTitle.innerText = "登录";
                submitBtn.innerText = "登录";
                document.querySelector(".switch").innerHTML = '还没有账号？ <a id="switchToRegister">注册</a>';
            }
            // 重新绑定事件
            document.getElementById("switchToRegister").onclick = switchToRegister.onclick;
        };

        // 登录/注册按钮点击
        submitBtn.onclick = () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                alert("请输入用户名和密码");
                return;
            }

            // 存储账号密码到 localStorage
            localStorage.setItem("username", username);
            localStorage.setItem("password", password);

            alert(modalTitle.innerText + "成功！\n下次会自动记住账号密码。");
            modal.style.display = "none";
        };

        // 注册 PWA service worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("Service Worker registered"))
                .catch(err => console.log("SW registration failed:", err));
        }
    </script>
</body>
</html>
